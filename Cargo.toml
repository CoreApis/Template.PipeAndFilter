[package]
name = "pipe-and-filter"
version = "0.1.0"
edition = "2021"
description = "Production-grade pipe-and-filter architecture template — a concurrent order-ingestion pipeline in Rust."

[[bin]]
name = "pipe-and-filter"
path = "src/main.rs"

[lib]
name = "pipe_and_filter"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
